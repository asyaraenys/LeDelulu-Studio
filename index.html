<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeDelulu Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Merriweather', 'serif'],
                        display: ['Playfair Display', 'serif'],
                    },
                    colors: {
                        paper: '#fdfdfd',
                        ink: '#333333',
                        stone: {
                            50: '#fafaf9',
                            100: '#f5f5f4',
                            200: '#e7e5e4',
                            300: '#d6d3d1',
                            400: '#a8a29e',
                            500: '#78716c',
                            600: '#57534e',
                            700: '#44403c',
                            800: '#292524',
                            900: '#1c1917',
                            950: '#0c0a09',
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            background-color: #fdfdfd;
            color: #333333;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        
        /* Dark Mode Body Override */
        html.dark body {
            background-color: #0c0a09;
            color: #e7e5e4;
        }

        /* Editor specific styles */
        .editor-content {
            outline: none;
            min-height: 80vh;
        }
        
        /* Placeholder for contenteditable */
        [contenteditable]:empty:before {
            content: attr(data-placeholder);
            color: #a8a29e;
            pointer-events: none;
            display: block;
        }
        html.dark [contenteditable]:empty:before {
            color: #57534e;
        }

        /* Rich Text Styling in Editor */
        .editor-content blockquote {
            border-left: 4px solid #d6d3d1;
            padding-left: 1rem;
            margin: 1rem 0;
            font-style: italic;
            color: #57534e;
        }
        html.dark .editor-content blockquote {
            border-color: #44403c;
            color: #a8a29e;
        }
        
        /* Lists Indentation Fix & Auto-numbering visibility */
        .editor-content ul { 
            list-style-type: disc; 
            list-style-position: outside;
            padding-left: 2em; 
            margin: 1rem 0;
        }
        .editor-content ol { 
            list-style-type: decimal; 
            list-style-position: outside;
            padding-left: 2em; 
            margin: 1rem 0;
        }
        
        /* Minimalist Scene Break */
        .editor-content hr {
            border: none;
            border-top: 1px solid #e0e0e0;
            margin: 40px 0;
            height: 1px;
        }
        html.dark .editor-content hr {
            border-color: #292524;
        }

        .editor-content b, .editor-content strong { font-weight: 700; }
        .editor-content i, .editor-content em { font-style: italic; }

        /* Toolbar Active State - High Contrast */
        .toolbar-btn.active {
            background-color: #333333 !important;
            color: #ffffff !important;
        }
        html.dark .toolbar-btn.active {
            background-color: #e7e5e4 !important;
            color: #0c0a09 !important;
        }

        /* Animation */
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #e7e5e4; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #d6d3d1; }
        
        html.dark ::-webkit-scrollbar-thumb { background: #292524; }
        html.dark ::-webkit-scrollbar-thumb:hover { background: #44403c; }

        /* Drag and Drop Styles */
        .chapter-item {
            cursor: grab;
        }
        .chapter-item:active {
            cursor: grabbing;
        }
        .chapter-item.dragging {
            opacity: 0.5;
            background-color: #e7e5e4;
            border: 1px dashed #78716c;
        }
        html.dark .chapter-item.dragging {
            background-color: #292524;
            border: 1px dashed #a8a29e;
        }
        .chapter-item.drag-over-top {
            border-top: 2px solid #78716c;
        }
        html.dark .chapter-item.drag-over-top {
            border-top: 2px solid #a8a29e;
        }
        .chapter-item.drag-over-bottom {
            border-bottom: 2px solid #78716c;
        }
        html.dark .chapter-item.drag-over-bottom {
            border-bottom: 2px solid #a8a29e;
        }
        
        /* Sidebar Transitions */
        #sidebar {
            transition: transform 0.3s ease, width 0.3s ease;
        }
        /* Mobile: Hidden by default (translated left) */
        .sidebar-mobile-closed {
            transform: translateX(-100%);
        }
        .sidebar-mobile-open {
            transform: translateX(0);
        }
        
        /* Desktop: Collapsed state */
        @media (min-width: 768px) {
            .sidebar-desktop-closed {
                width: 0 !important;
                overflow: hidden;
                border: none;
            }
            .sidebar-desktop-open {
                width: 18rem; /* w-72 */
            }
        }
    </style>
<script type="importmap">

  "imports": {

<body class="antialiased selection:bg-stone-200 dark:selection:bg-stone-800 selection:text-stone-900 dark:selection:text-stone-100">

    <!-- VIEW A: THE PORTAL -->

                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" /></svg>

                    <!-- Lists and HR -->

                    <button id="btn-insertOrderedList" onmousedown="event.preventDefault(); document.execCommand('insertOrderedList'); app.updateToolbar();" class="toolbar-btn p-2 w-8 h-8 flex items-center justify-center text-stone-600 dark:text-stone-400 rounded hover:bg-stone-100 dark:hover:bg-stone-800 font-serif transition-colors text-sm" title="Numbered List">1.</button>
                    <button onmousedown="event.preventDefault(); document.execCommand('insertHorizontalRule')" class="p-2 w-8 h-8 flex items-center justify-center text-stone-400 hover:text-stone-900 dark:hover:text-stone-100 rounded hover:bg-stone-100 dark:hover:bg-stone-800 transition-colors" title="Scene Break">

    <!-- EXPORT MODAL -->
    <div id="export-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">

                    Export JSON

                <button onclick="app.performExport('html')" class="py-2 px-4 rounded-md bg-stone-900 dark:bg-stone-100 text-white dark:text-stone-900 font-sans text-sm hover:bg-stone-800 dark:hover:bg-stone-200 transition-colors shadow-sm">

    <script>
        const app = {
            data: {
                title: "Untitled Story",
                author: "Unknown Author",
                chapters: []
            },
            currentChapterIndex: 0,
            hasUnsavedChanges: false,
            // Sidebar State
            isSidebarOpen: true,
            // Drag and Drop State
            dragSrcIndex: null,
            dropPosition: null, // 'before' or 'after'
            
            init() {
                // Initialize Theme
                if (localStorage.getItem('ledelulu_theme') === 'dark' || (!('ledelulu_theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                    document.documentElement.classList.add('dark');
                    this.updateThemeIcons(true);
                } else {
                    document.documentElement.classList.remove('dark');
                    this.updateThemeIcons(false);
                }

                // Check for local save
                if (localStorage.getItem('ledelulu_draft')) {
                    document.getElementById('continue-draft-container').classList.remove('hidden');
                }
                
                // Initialize Sidebar State based on screen width
                if (window.innerWidth < 768) {
                    this.isSidebarOpen = false;
                } else {
                    this.isSidebarOpen = true;
                }
                this.updateSidebarUI();

                // 1. Auto-resize Title
                const titleInput = document.getElementById('chapter-title-input');
                titleInput.addEventListener('input', function() {
                    this.style.height = 'auto';
                    this.style.height = (this.scrollHeight) + 'px';
                    app.saveCurrentChapter();
                });

                // 2. Date Input
                const dateInput = document.getElementById('chapter-date-input');
                dateInput.addEventListener('input', () => {
                    app.saveCurrentChapter();
                });
                
                // 3. Editor Changes
                const bodyInput = document.getElementById('chapter-body-input');
                bodyInput.addEventListener('input', () => {
                    app.saveCurrentChapter();
                });
                
                // 4. Toolbar Update Triggers
                // We update toolbar on click, keyup (cursor move), and selection change
                bodyInput.addEventListener('mouseup', () => app.updateToolbar());
                bodyInput.addEventListener('keyup', () => app.updateToolbar());
                document.addEventListener('selectionchange', () => app.updateToolbar());

                // 5. Click to Focus Editor
                document.getElementById('editor-container').addEventListener('click', (e) => {
                    if (e.target.id === 'editor-container' || e.target.id === 'bottom-spacer') {
                        const editor = document.getElementById('chapter-body-input');
                        editor.focus();
                        // Move cursor to end
                        const range = document.createRange();
                        range.selectNodeContents(editor);
                        range.collapse(false);
                        const sel = window.getSelection();
                        sel?.removeAllRanges();
                        sel?.addRange(range);
                    }
                });
                
                // 6. Browser Close Protection
                window.addEventListener('beforeunload', (e) => {
                    if (app.hasUnsavedChanges) {
                        e.preventDefault();
                        e.returnValue = ''; // Chrome requires returnValue to be set
                    }
                });

                // 7. Project Meta Inputs (Sidebar Direct Edit)
                const projTitle = document.getElementById('project-title-input');
                const projAuthor = document.getElementById('project-author-input');
                
                projTitle.addEventListener('input', (e) => {
                    app.data.title = e.target.value;
                    app.hasUnsavedChanges = true;
                    app.updateSaveUI();
                    app.saveToLocal();
                });
                
                projAuthor.addEventListener('input', (e) => {
                    app.data.author = e.target.value;
                    app.hasUnsavedChanges = true;
                    app.updateSaveUI();
                    app.saveToLocal();
                });
            },
            
            toggleSidebar() {
                this.isSidebarOpen = !this.isSidebarOpen;
                this.updateSidebarUI();
            },
            
            updateSidebarUI() {
                const sidebar = document.getElementById('sidebar');
                const overlay = document.getElementById('sidebar-overlay');
                
                if (this.isSidebarOpen) {
                    // Open State
                    sidebar.classList.remove('sidebar-mobile-closed', 'sidebar-desktop-closed');
                    sidebar.classList.add('sidebar-mobile-open', 'sidebar-desktop-open');
                    overlay.classList.remove('hidden');
                } else {
                    // Closed State
                    sidebar.classList.remove('sidebar-mobile-open', 'sidebar-desktop-open');
                    sidebar.classList.add('sidebar-mobile-closed', 'sidebar-desktop-closed');
                    overlay.classList.add('hidden');
                }
            },
            
            toggleTheme() {
                if (document.documentElement.classList.contains('dark')) {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('ledelulu_theme', 'light');
                    this.updateThemeIcons(false);
                } else {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('ledelulu_theme', 'dark');
                    this.updateThemeIcons(true);
                }
            },
            
            updateThemeIcons(isDark) {
                const icon = document.getElementById('theme-icon-portal');
                const btnText = document.getElementById('theme-btn-text');
                
                if (isDark) {
                     // Sun icon for "Switch to Light"
                    if(icon) icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />';
                    if(btnText) btnText.textContent = "Light Mode";
                } else {
                    // Moon icon for "Switch to Dark"
                    if(icon) icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />';
                    if(btnText) btnText.textContent = "Dark Mode";
                }
            },
            
            updateToolbar() {
                const commands = ['bold', 'italic', 'underline', 'insertUnorderedList', 'insertOrderedList'];
                
                commands.forEach(cmd => {
                    const isActive = document.queryCommandState(cmd);
                    const btn = document.getElementById('btn-' + cmd);
                    if (btn) {
                        if (isActive) {
                            btn.classList.add('active');
                            btn.classList.remove('text-stone-600', 'dark:text-stone-400', 'hover:bg-stone-100', 'dark:hover:bg-stone-800');
                        } else {
                            btn.classList.remove('active');
                            btn.classList.add('text-stone-600', 'dark:text-stone-400', 'hover:bg-stone-100', 'dark:hover:bg-stone-800');
                        }
                    }
                });
            },

            checkUnsaved() {
                if (this.hasUnsavedChanges) {
                    return confirm("You have unsaved changes that haven't been exported to a file yet. Are you sure you want to proceed?");
                }
                return true;
            },

            startNew() {
                if (!this.checkUnsaved()) return;
                
                this.data = {
                    title: "Untitled Story",
                    author: "Unknown Author",
                    chapters: [
                        { title: "", content: "", date: new Date().toLocaleDateString(), id: Date.now() }
                    ]
                };
                this.currentChapterIndex = 0;
                this.hasUnsavedChanges = false;
                this.switchView('studio');
                this.renderSidebar();
                this.loadChapterToEditor();
                this.updateSaveUI();
                this.saveToLocal();
            },
            
            continueDraft() {
                if (!this.checkUnsaved()) return;
                this.loadFromLocal();
                this.switchView('studio');
                this.renderSidebar();
                this.loadChapterToEditor();
            },

            loadFromFile(input) {
                if (!this.checkUnsaved()) {
                    input.value = ''; // Reset input
                    return;
                }
                
                const file = input.files[0];
                if (!file) return;
                
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const json = JSON.parse(e.target.result);
                        this.data = json;
                        this.currentChapterIndex = 0;
                        this.hasUnsavedChanges = false;
                        this.switchView('studio');
                        this.renderSidebar();
                        this.loadChapterToEditor();
                        this.updateSaveUI();
                        this.saveToLocal();
                    } catch (err) {
                        alert("Invalid file format.");
                    }
                };
                reader.readAsText(file);
            },

            exitToPortal() {
                if (!this.checkUnsaved()) return;
                this.switchView('portal');
                // We re-check for draft to show the button if they exited
                if (localStorage.getItem('ledelulu_draft')) {
                    document.getElementById('continue-draft-container').classList.remove('hidden');
                }
            },

            switchView(viewName) {
                document.getElementById('view-portal').classList.add('hidden');
                document.getElementById('view-studio').classList.add('hidden');
                document.getElementById(`view-${viewName}`).classList.remove('hidden');
                
                if (viewName === 'studio') {
                    // Reset sidebar state on desktop/mobile
                     if (window.innerWidth < 768) {
                        this.isSidebarOpen = false;
                    } else {
                        this.isSidebarOpen = true;
                    }
                    this.updateSidebarUI();
                }
            },

            // --- DRAG AND DROP HANDLERS ---
            handleDragStart(e) {
                const btn = e.target.closest('button');
                if (!btn) return;
                
                app.dragSrcIndex = Number(btn.dataset.index);
                e.dataTransfer.effectAllowed = 'move';
                e.dataTransfer.setData('text/plain', app.dragSrcIndex);
                
                // Slight delay to add class so the drag image is standard, but the element fades
                setTimeout(() => btn.classList.add('dragging'), 0);
            },

            handleDragOver(e) {
                if (e.preventDefault) e.preventDefault();
                const btn = e.target.closest('button');
                if (!btn || btn.dataset.index == app.dragSrcIndex) return false;
                
                const rect = btn.getBoundingClientRect();
                const relY = e.clientY - rect.top;
                
                // Determine insertion point: Top half -> Before, Bottom half -> After
                if (relY > rect.height / 2) {
                    btn.classList.add('drag-over-bottom');
                    btn.classList.remove('drag-over-top');
                    app.dropPosition = 'after';
                } else {
                    btn.classList.add('drag-over-top');
                    btn.classList.remove('drag-over-bottom');
                    app.dropPosition = 'before';
                }
                
                return false;
            },

            handleDragEnter(e) {
                // handled by dragOver styling
            },

            handleDragLeave(e) {
                const btn = e.target.closest('button');
                if (btn) {
                    btn.classList.remove('drag-over-top', 'drag-over-bottom');
                }
            },
            
            handleDragEnd(e) {
                 const btns = document.querySelectorAll('.chapter-item');
                 btns.forEach(b => b.classList.remove('dragging', 'drag-over-top', 'drag-over-bottom'));
            },

            handleDrop(e) {
                e.stopPropagation();
                const btn = e.target.closest('button');
                if (app.dragSrcIndex !== null && btn) {
                    const fromIndex = app.dragSrcIndex;
                    let toIndex = Number(btn.dataset.index);
                    
                    if (fromIndex !== toIndex) {
                        const chapters = app.data.chapters;
                        // Keep track of active chapter ID to maintain selection
                        const activeChapterId = chapters[app.currentChapterIndex]?.id;
                        
                        // Calculate final insertion index
                        // Remove item first
                        const [item] = chapters.splice(fromIndex, 1);
                        
                        // If we removed an item before the target, the target index shifts down by 1
                        if (fromIndex < toIndex) {
                            toIndex--;
                        }
                        
                        // If drop position is 'after', we increment target index to insert after it
                        if (app.dropPosition === 'after') {
                            toIndex++;
                        }
                        
                        // Insert item
                        chapters.splice(toIndex, 0, item);
                        
                        // Restore Active Selection
                        if (activeChapterId) {
                            const newIndex = chapters.findIndex(c => c.id === activeChapterId);
                            if (newIndex !== -1) app.currentChapterIndex = newIndex;
                        } else {
                            // If active chapter was somehow lost (shouldn't happen), select the moved one
                            app.currentChapterIndex = toIndex;
                        }
                        
                        app.hasUnsavedChanges = true;
                        app.updateSaveUI();
                        app.renderSidebar();
                        app.saveToLocal();
                    }
                }
                return false;
            },

            renderSidebar() {
                // Update editable inputs with current data
                document.getElementById('project-title-input').value = this.data.title;
                document.getElementById('project-author-input').value = this.data.author;
                
                const list = document.getElementById('chapter-list');
                list.innerHTML = '';
                
                this.data.chapters.forEach((chapter, index) => {
                    const btn = document.createElement('button');
                    const isActive = index === this.currentChapterIndex;
                    
                    // Add Drag Properties
                    btn.setAttribute('draggable', 'true');
                    btn.dataset.index = index;
                    
                    // Listeners
                    btn.addEventListener('dragstart', app.handleDragStart);
                    btn.addEventListener('dragover', app.handleDragOver);
                    btn.addEventListener('dragleave', app.handleDragLeave);
                    btn.addEventListener('drop', app.handleDrop);
                    btn.addEventListener('dragend', app.handleDragEnd);
                    
                    btn.className = `chapter-item w-full text-left px-3 py-2 rounded-md text-sm font-sans transition-all mb-1 select-none border border-transparent ${
                        isActive 
                        ? 'bg-stone-200 dark:bg-stone-800 text-stone-900 dark:text-stone-100 font-semibold' 
                        : 'text-stone-500 dark:text-stone-400 hover:bg-stone-100 dark:hover:bg-stone-800'
                    }`;
                    // REMOVED AUTO NUMBERING
                    btn.textContent = chapter.title || 'Untitled Chapter';
                    btn.onclick = () => app.selectChapter(index);
                    list.appendChild(btn);
                });
            },

            selectChapter(index) {
                // We don't need checkUnsaved here because switching chapters keeps us in the same "Project"
                // which is covered by saveToLocal()
                this.currentChapterIndex = index;
                this.renderSidebar(); 
                this.loadChapterToEditor();
                
                // On mobile, close sidebar after selection for better UX
                if (window.innerWidth < 768) {
                    this.isSidebarOpen = false;
                    this.updateSidebarUI();
                }
            },

            addChapter() {
                this.data.chapters.push({
                    title: "",
                    content: "",
                    date: new Date().toLocaleDateString(),
                    id: Date.now()
                });
                this.currentChapterIndex = this.data.chapters.length - 1;
                this.hasUnsavedChanges = true;
                this.updateSaveUI();
                this.renderSidebar();
                this.loadChapterToEditor();
                this.saveToLocal();
                
                 // On mobile, close sidebar after adding to write
                if (window.innerWidth < 768) {
                    this.isSidebarOpen = false;
                    this.updateSidebarUI();
                }
            },

            loadChapterToEditor() {
                const chapter = this.data.chapters[this.currentChapterIndex];
                const titleInput = document.getElementById('chapter-title-input');
                const dateInput = document.getElementById('chapter-date-input');
                const bodyInput = document.getElementById('chapter-body-input');
                
                titleInput.value = chapter.title || "";
                dateInput.value = chapter.date || "";
                bodyInput.innerHTML = chapter.content || "";
                
                // Trigger resize
                titleInput.style.height = 'auto';
                titleInput.style.height = titleInput.scrollHeight + 'px';
            },

            saveCurrentChapter() {
                const title = document.getElementById('chapter-title-input').value;
                const date = document.getElementById('chapter-date-input').value;
                const content = document.getElementById('chapter-body-input').innerHTML;
                
                if (this.data.chapters[this.currentChapterIndex]) {
                    // Check if actually changed to avoid triggering dirty state on mere clicks
                    const currentChap = this.data.chapters[this.currentChapterIndex];
                    if (currentChap.title !== title || currentChap.content !== content || currentChap.date !== date) {
                         currentChap.title = title;
                         currentChap.content = content;
                         currentChap.date = date;
                         
                         this.hasUnsavedChanges = true;
                         this.updateSaveUI();
                         this.renderSidebar();
                         this.saveToLocal();
                    }
                }
            },
            
            saveToLocal() {
                localStorage.setItem('ledelulu_draft', JSON.stringify(this.data));
            },
            
            loadFromLocal() {
                const saved = localStorage.getItem('ledelulu_draft');
                if (saved) {
                    this.data = JSON.parse(saved);
                }
            },
            
            updateSaveUI() {
                const btn = document.getElementById('btn-save-project');
                if (this.hasUnsavedChanges) {
                    btn.textContent = "Save Project *";
                    btn.classList.add('border-stone-400', 'dark:border-stone-500', 'text-stone-800', 'dark:text-stone-100');
                    btn.classList.remove('border-stone-200', 'dark:border-stone-700', 'text-stone-500', 'dark:text-stone-400');
                } else {
                    btn.textContent = "Save Project";
                    btn.classList.remove('border-stone-400', 'dark:border-stone-500', 'text-stone-800', 'dark:text-stone-100');
                    btn.classList.add('border-stone-200', 'dark:border-stone-700', 'text-stone-500', 'dark:text-stone-400');
                }
            },

            // --- EXPORT MANAGER ---

            openExportModal() {
                const modal = document.getElementById('export-modal');
                const list = document.getElementById('export-chapter-list');
                list.innerHTML = '';
                
                // Handle Select All
                const selectAll = document.getElementById('export-select-all');
                selectAll.checked = true;
                selectAll.onclick = (e) => {
                    const checkboxes = list.querySelectorAll('input[type="checkbox"]');
                    checkboxes.forEach(cb => cb.checked = e.target.checked);
                };

                // Generate List
                this.data.chapters.forEach((chapter, index) => {
                    const div = document.createElement('div');
                    div.className = 'flex items-center gap-3 p-2 hover:bg-stone-50 dark:hover:bg-stone-800 rounded transition-colors';
                    div.innerHTML = `
                        <input type="checkbox" class="export-checkbox w-4 h-4 accent-stone-900 dark:accent-stone-100 cursor-pointer" id="export-ch-${index}" checked value="${index}">
                        <label for="export-ch-${index}" class="text-sm font-sans truncate cursor-pointer select-none flex-1 text-stone-700 dark:text-stone-300">${index + 1}. ${chapter.title || 'Untitled'}</label>
                    `;
                    list.appendChild(div);
                });
                
                modal.classList.remove('hidden');
            },

            closeExportModal() {
                document.getElementById('export-modal').classList.add('hidden');
            },

            performExport(type) {
                const checkboxes = document.querySelectorAll('.export-checkbox:checked');
                if (checkboxes.length === 0) {
                    alert("Please select at least one chapter.");
                    return;
                }
                
                const selectedIndices = Array.from(checkboxes).map(cb => parseInt(cb.value));
                // Ensure order
                selectedIndices.sort((a,b) => a - b);
                
                const selectedChapters = selectedIndices.map(i => this.data.chapters[i]);
                
                const exportData = {
                    title: this.data.title,
                    author: this.data.author,
                    chapters: selectedChapters
                };
                
                if (type === 'json') {
                    this.exportJSON(exportData);
                } else {
                    this.publishHTML(exportData);
                }
                
                this.closeExportModal();
            },

            exportJSON(data = this.data) {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(data));
                const downloadAnchorNode = document.createElement('a');
                downloadAnchorNode.setAttribute("href", dataStr);
                const safeTitle = data.title.replace(/[^a-z0-9]/gi, '_').toLowerCase();
                downloadAnchorNode.setAttribute("download", safeTitle + ".json");
                document.body.appendChild(downloadAnchorNode);
                downloadAnchorNode.click();
                downloadAnchorNode.remove();
                
                // Only reset dirty flag if we exported the whole thing (default)
                if (data === this.data) {
                    this.hasUnsavedChanges = false;
                    this.updateSaveUI();
                }
            },

            publishHTML(data = this.data) {
                const safeTitle = data.title.replace(/[^a-z0-9]/gi, '_').toLowerCase();
                const contentHtml = data.chapters.map((c, index) => {
                    const isOpen = index === data.chapters.length - 1 ? 'open' : '';
                    const dateDisplay = c.date ? c.date : '';
                    return `
                    <details class="chapter" id="chapter-${index}" ${isOpen}>
                        <summary>
                            <div class="header-group">
                                <h2>${c.title}</h2>
                                <span class="meta">${dateDisplay}</span>
                            </div>
                        </summary>
                        <div class="content fade-in">${c.content}</div>
                    </details>`;
                }).join('');

                const htmlTemplate = `<!DOCTYPE html>
<html lang="en">
<head>

    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>

        }

                --bg-color: #0c0a09;

                --blockquote-border: #44403c;

        body { background: var(--bg-color); color: var(--text-color); font-family: 'Merriweather', serif; line-height: 1.8; margin: 0; padding: 40px 20px; transition: background 0.3s, color 0.3s; }

</head>
<body>

            let isOldestFirst = true;

            btn.addEventListener('click', () => {
                const chapters = Array.from(container.children);
                container.innerHTML = '';
                chapters.reverse().forEach(c => container.appendChild(c));
                isOldestFirst = !isOldestFirst;
                btn.textContent = isOldestFirst ? "Sort: Oldest First ⬇" : "Sort: Newest First ⬆";

                const blob = new Blob([htmlTemplate], { type: 'text/html' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `LeDelulu_${safeTitle}.html`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            },

            // --- IMPORT & NEW WINDOW ---

            triggerImport() {
                document.getElementById('import-upload').click();
            },

            importChapters(input) {
                const file = input.files[0];
                if (!file) return;
                
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const json = JSON.parse(e.target.result);
                        let newChapters = [];
                        
                        // Handle LeDelulu format (Story Object)
                        if (json.chapters && Array.isArray(json.chapters)) {
                            newChapters = json.chapters;
                        } 
                        // Handle simple array of chapters
                        else if (Array.isArray(json)) {
                            newChapters = json;
                        } 
                        // Handle single chapter object
                        else if (json.content && (json.title !== undefined)) {
                            newChapters = [json];
                        } else {
                            throw new Error("Unknown format");
                        }
                        
                        // Assign new unique IDs to avoid collision
                        newChapters.forEach(c => c.id = Date.now() + Math.random());
                        
                        // Merge
                        this.data.chapters = [...this.data.chapters, ...newChapters];
                        this.hasUnsavedChanges = true;
                        
                        this.renderSidebar();
                        this.updateSaveUI();
                        this.saveToLocal();
                        alert(`Successfully imported ${newChapters.length} chapter(s).`);
                    } catch (err) {
                        alert("Failed to import: Invalid file format.");
                        console.error(err);
                    }
                    input.value = ''; // Reset input to allow re-importing same file
                };
                reader.readAsText(file);
            },

            openNewWindow() {
                window.open(window.location.href, '_blank');
            }
        };

        // Initialize
        app.init();
        window.app = app; // Explicitly attach to window
    </script>
</body>
